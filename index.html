<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Desk | Gestão de Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .d-none {
      display: none !important;
    }

    .chart-container {
      position: relative;
      height: 250px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div id="tela-login" class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-4 mt-5">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4">
            <h3 class="text-center text-primary mb-4 fw-bold">M-Desk</h3>
            <p class="text-muted text-center mb-4">Insira suas credenciais de acesso</p>
            <form id="form-login">
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="login-email" class="form-control" required>
              </div>
              <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" id="login-senha" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar no Sistema</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tela-sistema" class="container mt-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-white mb-0">M-Desk | <span id="txt-nome-perfil" class="fs-4 fw-light"></span></h2>
      <button class="btn btn-light btn-sm fw-bold px-3 text-danger" onclick="logout()">Sair</button>
    </div>

    <div id="container-dashboard" class="row mb-4 d-none">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-white text-center fw-bold text-secondary">
            Status dos Chamados
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="graficoStatus"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-header bg-white text-center fw-bold text-secondary">
            Volume por Categoria
          </div>
          <div class="card-body">
            <div class="chart-container">
              <canvas id="graficoCategoria"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div id="container-formulario" class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white">
            <h5 class="card-title mb-0 text-secondary fw-bold">Novo Chamado</h5>
          </div>
          <div class="card-body">
            <form id="form-chamado">
              <div class="mb-3">
                <label class="form-label">Título do Problema</label>
                <input type="text" id="titulo" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select id="categoria" class="form-select" required>
                  <option value="">Selecione...</option>
                  <option value="Frente de Caixa/PDV">Frente de Caixa/PDV</option>
                  <option value="Impressoras">Impressoras</option>
                  <option value="Infraestrutura/Rede">Infraestrutura/Rede</option>
                  <option value="Hardware">Hardware</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Descrição Detalhada</label>
                <textarea id="descricao" class="form-control" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Abrir Chamado</button>
            </form>
          </div>
        </div>
      </div>

      <div id="container-tabela" class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 text-secondary fw-bold">Painel de Monitoramento</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="carregarDados()">Atualizar</button>
          </div>
          <div class="card-body p-0">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Detalhes do Chamado</th>
                  <th>Status</th>
                  <th id="th-acoes">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-chamados"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalAtendimento" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Atender #<span id="modal-id-display"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-atendimento">
            <input type="hidden" id="modal-id-chamado">
            <div class="mb-3">
              <label class="form-label">Novo Status</label>
              <select id="modal-status" class="form-select" required>
                <option value="Em Atendimento">Em Atendimento</option>
                <option value="Aguardando Peça">Aguardando Peça</option>
                <option value="Resolvido">Resolvido</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Nota de Resolução</label>
              <textarea id="modal-nota" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Salvar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:5000/api';
    const modalBootstrap = new bootstrap.Modal(document.getElementById('modalAtendimento'));

    let usuarioLogadoId = null;
    let usuarioLogadoPerfil = null;
    let chartStatusInstancia = null;
    let chartCategoriaInstancia = null;

    // LOGIN
    document.getElementById('form-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (response.status === 200) {
          const user = await response.json();
          usuarioLogadoId = user.id;
          usuarioLogadoPerfil = user.perfil;

          document.getElementById('tela-login').classList.add('d-none');
          document.getElementById('tela-sistema').classList.remove('d-none');
          document.getElementById('txt-nome-perfil').innerText = `${user.nome} (${user.perfil.toUpperCase()})`;

          configurarLayoutPorPerfil();
          carregarDados();
        } else { alert('E-mail ou senha inválidos!'); }
      } catch (error) { alert('Erro de conexão.'); }
    });

    // LAYOUT E PERMISSÕES
    function configurarLayoutPorPerfil() {
      const formCol = document.getElementById('container-formulario');
      const tabelaCol = document.getElementById('container-tabela');
      const dashboard = document.getElementById('container-dashboard');
      const thAcoes = document.getElementById('th-acoes');

      if (usuarioLogadoPerfil === 'operador') {
        formCol.classList.add('d-none');
        tabelaCol.className = "col-md-12";
        dashboard.classList.remove('d-none'); // Mostra os gráficos para o gerente/operador
        thAcoes.classList.remove('d-none');
      } else {
        formCol.classList.remove('d-none');
        tabelaCol.className = "col-md-8";
        dashboard.classList.add('d-none'); // Esconde do cliente
        thAcoes.classList.add('d-none');
      }
    }

    // CARREGAR TUDO (Tabela e Dashboard)
    async function carregarDados() {
      carregarChamados();
      if (usuarioLogadoPerfil === 'operador') {
        carregarDashboard();
      }
    }

    // TABELA DE CHAMADOS
    async function carregarChamados() {
      try {
        const response = await fetch(`${API_URL}/chamados`);
        const chamados = await response.json();
        const tbody = document.getElementById('tabela-chamados');
        tbody.innerHTML = '';

        chamados.forEach(chamado => {
          let corStatus = 'bg-warning';
          if (chamado.status === 'Resolvido') corStatus = 'bg-success';
          if (chamado.status === 'Aberto') corStatus = 'bg-danger';

          let botoesAcao = '';
          if (usuarioLogadoPerfil === 'operador') {
            let btnExcluir = chamado.status !== 'Resolvido' ? `<button class="btn btn-sm btn-outline-danger ms-1" onclick="excluirChamado(${chamado.id})">Excluir</button>` : '';
            botoesAcao = `<td><button class="btn btn-sm btn-primary" onclick="abrirModal(${chamado.id})">Atender</button>${btnExcluir}</td>`;
          } else {
            botoesAcao = `<td class="d-none"></td>`;
          }

          let notaDoTecnico = chamado.nota_resolucao && chamado.nota_resolucao.trim() !== ''
            ? `<div class="mt-2 p-2 text-dark bg-light rounded" style="font-size: 0.85em; border-left: 4px solid #0d6efd;"><strong>👨‍🔧 Resposta:</strong> ${chamado.nota_resolucao}</div>` : '';

          const tr = document.createElement('tr');
          tr.innerHTML = `
                    <td>#${chamado.id}</td>
                    <td>
                        <strong>${chamado.titulo}</strong><br>
                        <small class="text-primary fw-bold">${chamado.categoria}</small>
                        <div class="text-secondary mt-1" style="font-size: 0.9em;"><em>${chamado.descricao}</em></div>
                        ${notaDoTecnico}
                    </td>
                    <td><span class="badge ${corStatus}">${chamado.status}</span></td>
                    ${botoesAcao}
                `;
          tbody.appendChild(tr);
        });
      } catch (error) { console.error('Erro:', error); }
    }

    // RENDERIZAR GRÁFICOS DO DASHBOARD
    async function carregarDashboard() {
      try {
        const response = await fetch(`${API_URL}/dashboard`);
        const dados = await response.json();

        // Monta os dados para o Gráfico de Status (Pizza/Rosca)
        const labelsStatus = dados.status.map(item => item.status);
        const valoresStatus = dados.status.map(item => item.total);

        // Monta os dados para o Gráfico de Categoria (Barras)
        const labelsCategoria = dados.categoria.map(item => item.categoria);
        const valoresCategoria = dados.categoria.map(item => item.total);

        // Destrói os gráficos antigos antes de desenhar os novos para não sobrepor
        if (chartStatusInstancia) chartStatusInstancia.destroy();
        if (chartCategoriaInstancia) chartCategoriaInstancia.destroy();

        // Cria uma regra de cores fixa para cada tipo de status
        const coresStatus = labelsStatus.map(status => {
          if (status === 'Aberto') return '#dc3545';           // Vermelho (Perigo)
          if (status === 'Resolvido') return '#198754';        // Verde (Sucesso)
          if (status === 'Em Atendimento') return '#0d6efd';   // Azul (Ação)
          if (status === 'Aguardando Peça') return '#ffc107';  // Amarelo (Aviso)
          return '#6c757d';                                    // Cinza (Padrão)
        });

        // Desenha Gráfico de Status com as cores dinâmicas
        const ctxStatus = document.getElementById('graficoStatus').getContext('2d');
        chartStatusInstancia = new Chart(ctxStatus, {
          type: 'doughnut',
          data: {
            labels: labelsStatus,
            datasets: [{
              data: valoresStatus,
              backgroundColor: coresStatus // <- Puxa as cores inteligentes aqui
            }]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });
        // Desenha Gráfico de Categoria
        const ctxCategoria = document.getElementById('graficoCategoria').getContext('2d');
        chartCategoriaInstancia = new Chart(ctxCategoria, {
          type: 'bar',
          data: {
            labels: labelsCategoria,
            datasets: [{
              label: 'Total de Chamados',
              data: valoresCategoria,
              backgroundColor: '#667eea'
            }]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

      } catch (error) { console.error('Erro no dashboard:', error); }
    }

    // AÇÕES DE CRUD (Restante igual)
    document.getElementById('form-chamado').addEventListener('submit', async function (e) {
      e.preventDefault();
      const dados = { titulo: document.getElementById('titulo').value, categoria: document.getElementById('categoria').value, descricao: document.getElementById('descricao').value, usuario_id: usuarioLogadoId };
      await fetch(`${API_URL}/chamados`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
      document.getElementById('form-chamado').reset();
      carregarDados();
    });

    function abrirModal(id) {
      document.getElementById('modal-id-chamado').value = id;
      document.getElementById('modal-nota').value = '';
      modalBootstrap.show();
    }

    document.getElementById('form-atendimento').addEventListener('submit', async function (e) {
      e.preventDefault();
      const id = document.getElementById('modal-id-chamado').value;
      const dadosAtualizacao = { status: document.getElementById('modal-status').value, nota_resolucao: document.getElementById('modal-nota').value };
      await fetch(`${API_URL}/chamados/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dadosAtualizacao) });
      modalBootstrap.hide();
      carregarDados();
    });

    async function excluirChamado(id) {
      if (confirm(`Excluir chamado #${id}?`)) {
        await fetch(`${API_URL}/chamados/${id}`, { method: 'DELETE' });
        carregarDados();
      }
    }

    function logout() {
      usuarioLogadoId = null; usuarioLogadoPerfil = null;
      document.getElementById('form-login').reset();
      document.getElementById('tela-sistema').classList.add('d-none');
      document.getElementById('tela-login').classList.remove('d-none');
      if (chartStatusInstancia) chartStatusInstancia.destroy();
      if (chartCategoriaInstancia) chartCategoriaInstancia.destroy();
    }
  </script>
</body>

</html>
