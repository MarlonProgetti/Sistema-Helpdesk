<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Desk | Gestão de Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .d-none {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="tela-login" class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-4 mt-5">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4">
            <h3 class="text-center text-primary mb-4 fw-bold">M-Desk</h3>
            <p class="text-muted text-center mb-4">Insira suas credenciais de acesso</p>
            <form id="form-login">
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="login-email" class="form-control" required placeholder="Ex: operador@teste.com">
              </div>
              <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" id="login-senha" class="form-control" required placeholder="***">
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2fw-bold">Entrar no Sistema</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tela-sistema" class="container mt-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-white mb-0">M-Desk | <span id="txt-nome-perfil" class="fs-4 fw-light"></span></h2>
      <button class="btn btn-light btn-sm fw-bold px-3 text-danger" onclick="logout()">Sair</button>
    </div>

    <div class="row">
      <div id="container-formulario" class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white">
            <h5 class="card-title mb-0 text-secondary fw-bold">Novo Chamado</h5>
          </div>
          <div class="card-body">
            <form id="form-chamado">
              <div class="mb-3">
                <label class="form-label">Título do Problema</label>
                <input type="text" id="titulo" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select id="categoria" class="form-select" required>
                  <option value="">Selecione...</option>
                  <option value="Frente de Caixa/PDV">Frente de Caixa/PDV</option>
                  <option value="Impressoras">Impressoras (Spooler/Drivers)</option>
                  <option value="Infraestrutura/Rede">Infraestrutura e Rede</option>
                  <option value="Hardware">Hardware (Desktop/TV Box)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Descrição Detalhada</label>
                <textarea id="descricao" class="form-control" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Abrir Chamado</button>
            </form>
          </div>
        </div>
      </div>

      <div id="container-tabela" class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 text-secondary fw-bold">Painel de Monitoramento</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="carregarChamados()">Atualizar</button>
          </div>
          <div class="card-body p-0">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Título</th>
                  <th>Status</th>
                  <th id="th-acoes">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-chamados">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalAtendimento" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Atender Chamado #<span id="modal-id-display"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-atendimento">
            <input type="hidden" id="modal-id-chamado">
            <div class="mb-3">
              <label class="form-label">Novo Status</label>
              <select id="modal-status" class="form-select" required>
                <option value="Em Atendimento">Em Atendimento</option>
                <option value="Aguardando Peça">Aguardando Peça</option>
                <option value="Resolvido">Resolvido</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Nota de Resolução do Técnico</label>
              <textarea id="modal-nota" class="form-control" rows="4" placeholder="Descreva o que foi feito..." required></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Salvar Atendimento</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:5000/api';
    const modalBootstrap = new bootstrap.Modal(document.getElementById('modalAtendimento'));

    // Variáveis globais para guardar quem está logado
    let usuarioLogadoId = null;
    let usuarioLogadoPerfil = null;

    // 1. EVENTO DE LOGIN
    document.getElementById('form-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (response.status === 200) {
          const user = await response.json();
          usuarioLogadoId = user.id;
          usuarioLogadoPerfil = user.perfil;

          // Transiciona as telas
          document.getElementById('tela-login').classList.add('d-none');
          document.getElementById('tela-sistema').classList.remove('d-none');
          document.getElementById('txt-nome-perfil').innerText = `${user.nome} (${user.perfil.toUpperCase()})`;

          configurarLayoutPorPerfil();
          carregarChamados();
        } else {
          alert('E-mail ou senha inválidos!');
        }
      } catch (error) {
        alert('Erro ao tentar conectar com o servidor.');
      }
    });

    // 2. CONFIGURAR INTERFACE BASEADO NO PERFIL
    function configurarLayoutPorPerfil() {
      const formCol = document.getElementById('container-formulario');
      const tabelaCol = document.getElementById('container-tabela');
      const thAcoes = document.getElementById('th-acoes');

      if (usuarioLogadoPerfil === 'operador') {
        formCol.classList.add('d-none'); // Esconde o formulário
        tabelaCol.className = "col-md-12"; // Expande a tabela para ocupar a tela toda
        thAcoes.classList.remove('d-none');
      } else {
        // Se for Solicitante
        formCol.classList.remove('d-none');
        tabelaCol.className = "col-md-8";
        thAcoes.classList.add('d-none'); // Esconde a coluna inteira de ações na tabela
      }
    }

    // 3. CARREGAR CHAMADOS (GET)
    async function carregarChamados() {
      try {
        const response = await fetch(`${API_URL}/chamados`);
        const chamados = await response.json();
        const tbody = document.getElementById('tabela-chamados');
        tbody.innerHTML = '';

        chamados.forEach(chamado => {
          let corStatus = 'bg-warning';
          if (chamado.status === 'Resolvido') corStatus = 'bg-success';
          if (chamado.status === 'Aberto') corStatus = 'bg-danger';

          // Monta os botões apenas se for operador
          let botoesAcao = '';
          if (usuarioLogadoPerfil === 'operador') {
            let botaoExcluir = '';
            if (chamado.status !== 'Resolvido') {
              botaoExcluir = `<button class="btn btn-sm btn-outline-danger ms-1" onclick="excluirChamado(${chamado.id})">Excluir</button>`;
            }
            botoesAcao = `
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="abrirModal(${chamado.id})">Atender</button>
                            ${botaoExcluir}
                        </td>`;
          } else {
            botoesAcao = `<td class="d-none"></td>`;
          }

          // Verifica se o técnico escreveu alguma nota. Se sim, cria uma caixa de aviso estilizada.
          let notaDoTecnico = '';
          if (chamado.nota_resolucao && chamado.nota_resolucao.trim() !== '') {
            notaDoTecnico = `
                        <div class="mt-2 p-2 text-dark bg-light rounded" style="font-size: 0.85em; border-left: 4px solid #0d6efd;">
                            <strong>👨‍🔧 Resposta do Suporte:</strong> ${chamado.nota_resolucao}
                        </div>
                    `;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
                    <td>#${chamado.id}</td>
                    <td>
                        <strong>${chamado.titulo}</strong><br>
                        <small class="text-primary fw-bold">${chamado.categoria}</small>
                        
                        <div class="text-secondary mt-1" style="font-size: 0.9em;">
                            <em>${chamado.descricao}</em>
                        </div>
                        
                        ${notaDoTecnico} </td>
                    <td><span class="badge ${corStatus}">${chamado.status}</span></td>
                    ${botoesAcao}
                `;
          tbody.appendChild(tr);
        });
      } catch (error) { console.error('Erro:', error); }
    }

    // 4. ABRIR NOVO CHAMADO (POST)
    document.getElementById('form-chamado').addEventListener('submit', async function (e) {
      e.preventDefault();
      const dados = {
        titulo: document.getElementById('titulo').value,
        categoria: document.getElementById('categoria').value,
        descricao: document.getElementById('descricao').value,
        usuario_id: usuarioLogadoId // Associa o chamado dinamicamente ao ID de quem logou!
      };
      try {
        await fetch(`${API_URL}/chamados`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        document.getElementById('form-chamado').reset();
        carregarChamados();
      } catch (error) { console.error(error); }
    });

    // 5. ABRIR O MODAL DO TÉCNICO
    function abrirModal(id) {
      document.getElementById('modal-id-chamado').value = id;
      document.getElementById('modal-id-display').innerText = id;
      document.getElementById('modal-nota').value = '';
      modalBootstrap.show();
    }

    // 6. SALVAR O ATENDIMENTO (PUT)
    document.getElementById('form-atendimento').addEventListener('submit', async function (e) {
      e.preventDefault();
      const id = document.getElementById('modal-id-chamado').value;
      const dadosAtualizacao = {
        status: document.getElementById('modal-status').value,
        nota_resolucao: document.getElementById('modal-nota').value
      };
      try {
        await fetch(`${API_URL}/chamados/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosAtualizacao)
        });
        modalBootstrap.hide();
        carregarChamados();
      } catch (error) { console.error(error); }
    });

    // 7. EXCLUIR CHAMADO (DELETE)
    async function excluirChamado(id) {
      if (confirm(`Tem certeza que deseja excluir o chamado #${id}?`)) {
        try {
          await fetch(`${API_URL}/chamados/${id}`, { method: 'DELETE' });
          carregarChamados();
        } catch (error) { console.error(error); }
      }
    }

    // 8. LOGOUT (SAIR)
    function logout() {
      usuarioLogadoId = null;
      usuarioLogadoPerfil = null;
      document.getElementById('form-login').reset();
      document.getElementById('tela-sistema').classList.add('d-none');
      document.getElementById('tela-login').classList.remove('d-none');
    }
  </script>

</body>

</html>
